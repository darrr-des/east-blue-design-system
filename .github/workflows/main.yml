name: Deploy to Aux

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22443
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            cd /mnt/volume_sgp1_01/east-blue
            git pull origin main
            cd astro-site
            npm ci
            # The build replaces dist/ and renames every file in dist/_astro/.
            # Keep the previous build's files so pages a browser cached before
            # this deploy still find their CSS and JS; drop copies older than 30 days.
            mkdir -p ../.astro-keep
            [ -d dist/_astro ] && cp -a dist/_astro/. ../.astro-keep/
            find ../.astro-keep -type f -mtime +30 -delete
            npm run build
            cp -an ../.astro-keep/. dist/_astro/

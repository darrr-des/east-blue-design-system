name: Visual regression

on:
  push:
    branches: [main]
    paths:
      - 'astro-site/public/scripts/demos/**'
      - 'astro-site/src/data/components/**'
      - 'astro-site/src/components/**'
      - 'astro-site/src/styles/**'
      - 'astro-site/src/pages/components/**'
      - 'astro-site/tests/**'
      - 'astro-site/playwright.config.ts'
      - 'astro-site/package*.json'
  pull_request:
    paths:
      - 'astro-site/public/scripts/demos/**'
      - 'astro-site/src/data/components/**'
      - 'astro-site/src/components/**'
      - 'astro-site/src/styles/**'
      - 'astro-site/src/pages/components/**'
      - 'astro-site/tests/**'
      - 'astro-site/playwright.config.ts'
      - 'astro-site/package*.json'

defaults:
  run:
    working-directory: astro-site

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: astro-site/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual regression
        # The gate calls /auth/me against a backend that does not exist in CI,
        # then redirects to /login — so every page under test rendered the
        # login screen and no spec card was ever found. This is why the suite
        # failed on every run since it was added.
        env:
          PUBLIC_AUTH_DISABLED: 'true'
        run: npm run test:visual -- --reporter=line

      - name: Upload diff artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-artefacts
          path: |
            astro-site/tests/.playwright-output/
            astro-site/tests/.playwright-report/
          retention-days: 7

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: astro-site/tests/.playwright-report/
          retention-days: 7

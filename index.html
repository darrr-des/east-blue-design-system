<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GCash Design System</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F7FA;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:600px;padding:40px 24px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:40px}
.logo-icon{width:42px;height:42px;background:#0056D6;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text h1{font-size:17px;font-weight:700;color:#0D1B2A;line-height:1.2}
.logo-text p{font-size:13px;color:#6B7A8D;margin-top:2px}
.cards{display:flex;flex-direction:column;gap:14px}
.card{display:flex;align-items:center;gap:18px;padding:22px 24px;background:#fff;border:1px solid #E2E8F0;border-radius:14px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#0056D6;box-shadow:0 4px 18px rgba(0,86,214,.10)}
.card-icon{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-icon.blue{background:#EEF3FB}
.card-icon.green{background:#EDFAF4}
.card-body{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:600;color:#0D1B2A}
.card-desc{font-size:13px;color:#6B7A8D;margin-top:3px;line-height:1.4}
.card-arrow{color:#C8D5E4;flex-shrink:0;transition:color .15s}
.card:hover .card-arrow{color:#0056D6}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="3" width="6" height="6" rx="1.5" fill="#fff"/>
        <rect x="13" y="3" width="6" height="6" rx="1.5" fill="#fff" opacity=".7"/>
        <rect x="3" y="13" width="6" height="6" rx="1.5" fill="#fff" opacity=".7"/>
        <rect x="13" y="13" width="6" height="6" rx="1.5" fill="#fff" opacity=".4"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>GCash Design System</h1>
      <p>Component Assessment</p>
    </div>
  </div>

  <div class="cards">
    <a class="card" href="report.html">
      <div class="card-icon blue">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M7 3H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2" stroke="#0056D6" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M8 3h6a1 1 0 0 1 1 1v1H7V4a1 1 0 0 1 1-1Z" stroke="#0056D6" stroke-width="1.6"/>
          <path d="M8 11h6M8 15h4" stroke="#0056D6" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card-body">
        <div class="card-title">Assessment Report</div>
        <div class="card-desc">Full component evaluation — verdicts, interaction states, tokens, and action items</div>
      </div>
      <div class="card-arrow">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 12 10 8 6 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </a>

    <a class="card" href="gcash-ds-assessment-guide.html">
      <div class="card-icon green">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M4 17V6a2 2 0 0 1 2-2h11" stroke="#17A667" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M6 19h11a1 1 0 0 0 1-1V7H6a2 2 0 0 0-2 2v9a1 1 0 0 0 1 1Z" stroke="#17A667" stroke-width="1.6"/>
          <path d="M9 11h5M9 14h3" stroke="#17A667" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card-body">
        <div class="card-title">Assessment Guide</div>
        <div class="card-desc">Quick-reference summary of open issues, patterns, and component status</div>
      </div>
      <div class="card-arrow">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 12 10 8 6 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </a>
  </div>
</div>
</body>
</html>

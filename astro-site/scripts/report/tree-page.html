<title>East Blue Workflow Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: a single terminal pane — breadcrumb, file tree, detail readout, key hints. Deliberately dark-only. */
:root {
  --bg: #0A0E14;
  --pane: #0D1117;
  --rule: #253041;
  --fg: #C9D4E3;
  --dim: #6B7A90;
  --guide: #2A3546;
  --sel: #16233A;
  --accent: #58B4FF;
  --folder: #7FA7D9;
  --json: #F2C14E;
  --md: #58B4FF;
  --js: #F7DF1E;
  --ts: #3D8BFF;
  --yml: #E0707A;
  --step: #7EE0A8;
  --cmd: #C89BFF;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--mono); font-size: 13.5px; line-height: 1.55; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 48px; }
.term { background: var(--pane); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px 14px; display: grid; gap: 12px; }
.crumb { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.crumb .org { color: var(--accent); }
.crumb .sep { color: var(--dim); }
.crumb .path { color: var(--fg); overflow-wrap: anywhere; }
.tree { overflow-x: auto; outline: none; padding-block: 4px; }
.tree:focus-visible { box-shadow: 0 0 0 1px var(--accent); border-radius: 4px; }
.row { display: flex; align-items: center; white-space: pre; cursor: pointer; padding: 0 8px 0 4px; border-radius: 4px; min-width: max-content; }
.row:hover { background: color-mix(in srgb, var(--sel) 60%, transparent); }
.row.sel { background: var(--sel); }
.row.sel .name { color: #FFFFFF; }
.lines { color: var(--guide); }
.caret { color: var(--dim); width: 2ch; display: inline-block; }
.ic { display: inline-flex; justify-content: center; min-width: 3ch; margin-right: 1ch; font-weight: 700; font-size: 11.5px; }
.ic svg { width: 15px; height: 15px; }
.name { color: var(--fg); }
.note { color: var(--dim); margin-left: 2ch; }
.t-step .name { color: var(--step); }
.t-cmd .name { color: var(--cmd); }
.detail { border-top: 1px solid var(--rule); padding-top: 10px; display: grid; gap: 4px; min-height: 5.2em; }
.detail .dpath { color: var(--accent); overflow-wrap: anywhere; }
.detail .ddesc { color: var(--fg); max-width: 78ch; }
.keys { border-top: 1px solid var(--rule); padding-top: 10px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; }
.keys b { color: var(--fg); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--dim); font-size: 12px; margin-top: 14px; }
.legend span i { font-style: normal; font-weight: 700; margin-right: 6px; }
@media (max-width: 480px) { body { font-size: 12.5px; } .term { padding: 14px 12px 12px; } .note { display: none; } }
</style>

<div class="wrap">
  <div class="term">
    <div class="crumb"><span class="org">frost</span><span class="sep">/</span><span class="path" id="crumb">east-blue-design-system</span></div>
    <div class="tree" id="tree" tabindex="0" role="tree" aria-label="Assessment workflow file tree"></div>
    <div class="detail" aria-live="polite">
      <div class="dpath" id="dpath"></div>
      <div class="ddesc" id="ddesc"></div>
    </div>
    <div class="keys"><span><b>[ENTER]</b> open / close</span><span>•</span><span><b>[↑ ↓]</b> navigate</span><span>•</span><span><b>[← →]</b> collapse / expand</span><span>•</span><span><b>[ESC]</b> back to parent</span></div>
  </div>
  <div class="legend">
    <span id="stamp" style="margin-right:auto"></span>
    <span><i style="color:var(--step)">▸</i>workflow step</span>
    <span><i style="color:var(--cmd)">$</i>npm command</span>
    <span><i style="color:var(--md)">M↓</i>guide</span>
    <span><i style="color:var(--json)">{}</i>data</span>
    <span><i style="color:var(--js)">JS</i>script</span>
    <span><i style="color:var(--yml)">CI</i>GitHub Action</span>
  </div>
</div>

<script>
let DATA = null;

const FOLDER = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="var(--folder)" d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.4 1.5h6a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg>';
const FOLDER_OPEN = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="var(--folder)" d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.4 1.5h5a1 1 0 0 1 1 1V6H4.2a1 1 0 0 0-.95.68L1.5 12z"/><path fill="var(--folder)" opacity=".7" d="M4.2 7h10.6l-2 6H2.2z"/></svg>';
const ICON = {
  md: ['M↓', 'var(--md)'], json: ['{}', 'var(--json)'], js: ['JS', 'var(--js)'],
  ts: ['TS', 'var(--ts)'], yml: ['CI', 'var(--yml)'], step: ['▸', 'var(--step)'], cmd: ['$', 'var(--cmd)'],
};

let selected = null;
const treeEl = document.getElementById('tree');
let visible = [];

function prefix(node) {
  const parts = [];
  let p = node;
  while (p.parent && p.parent.parent) { parts.unshift(p.parent.last ? '    ' : '│   '); p = p.parent; }
  if (!node.parent) return '';
  return parts.join('') + (node.last ? '└── ' : '├── ');
}

function render() {
  visible = [];
  (function walk(n) { visible.push(n); if (n.c && n.open) n.c.forEach(walk); })(DATA);
  treeEl.innerHTML = '';
  for (const n of visible) {
    const row = document.createElement('div');
    const kids = !!n.c;
    row.className = 'row t-' + n.t + (n === selected ? ' sel' : '');
    row.setAttribute('role', 'treeitem');
    if (kids) row.setAttribute('aria-expanded', n.open ? 'true' : 'false');
    const lines = document.createElement('span'); lines.className = 'lines'; lines.textContent = prefix(n);
    const caret = document.createElement('span'); caret.className = 'caret'; caret.textContent = kids ? (n.open ? '⌄' : '›') : '';
    const ic = document.createElement('span'); ic.className = 'ic';
    if (n.t === 'dir') ic.innerHTML = n.open ? FOLDER_OPEN : FOLDER;
    else { ic.textContent = ICON[n.t][0]; ic.style.color = ICON[n.t][1]; }
    const name = document.createElement('span'); name.className = 'name'; name.textContent = n.n;
    row.append(lines, caret, ic, name);
    if (n.note) { const note = document.createElement('span'); note.className = 'note'; note.textContent = n.note; row.append(note); }
    row.addEventListener('click', () => { if (selected === n && kids) n.open = !n.open; selected = n; render(); treeEl.focus({ preventScroll: true }); });
    treeEl.append(row);
    if (n === selected) requestAnimationFrame(() => row.scrollIntoView({ block: 'nearest' }));
  }
  document.getElementById('dpath').textContent = selected.path;
  document.getElementById('ddesc').textContent = selected.d || '';
  document.getElementById('crumb').textContent = selected.path.replace(/\/$/, '');
}

treeEl.addEventListener('keydown', e => {
  const i = visible.indexOf(selected);
  const kids = !!selected.c;
  if (e.key === 'ArrowDown') selected = visible[Math.min(i + 1, visible.length - 1)];
  else if (e.key === 'ArrowUp') selected = visible[Math.max(i - 1, 0)];
  else if (e.key === 'Enter' || e.key === ' ') { if (kids) selected.open = !selected.open; }
  else if (e.key === 'ArrowRight') { if (kids && !selected.open) selected.open = true; else if (kids) selected = selected.c[0]; }
  else if (e.key === 'ArrowLeft') { if (kids && selected.open) selected.open = false; else if (selected.parent) selected = selected.parent; }
  else if (e.key === 'Escape') { if (selected.parent) { selected = selected.parent; selected.open = false; } }
  else return;
  e.preventDefault();
  render();
});

function start(data) {
  DATA = data.tree;
  (function link(node, parent, path) {
    node.parent = parent;
    node.path = path + node.n;
    (node.c || []).forEach((k, i, arr) => { k.last = i === arr.length - 1; link(k, node, node.t === "dir" ? node.path : node.path + " › "); });
  })(DATA, null, "");
  const find = (n, name) => n.c && n.c.find((k) => k.n === name);
  const wf = find(DATA, "workflows/"), build = wf && find(wf, "build/");
  selected = (build && find(build, "COMPONENT-UPDATE-GUIDE.md")) || DATA;
  const when = data.generatedAt ? new Date(data.generatedAt) : null;
  document.getElementById("stamp").textContent = when ? "Updated " + when.toLocaleString("en-PH", { dateStyle: "medium", timeStyle: "short" }) : "";
  render();
}

fetch("workflow-tree.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(start)
  .catch(() => { document.getElementById("ddesc").textContent = "The tree data didn’t load. Refresh the page; if it keeps failing, ask for the report to be republished."; });
</script>
